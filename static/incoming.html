<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainyCat — Incoming</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--success:#22c55e;--danger:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:var(--bg);color:var(--text)}
header{background:var(--surface);padding:.8rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--border)}
header a{color:var(--muted);text-decoration:none}header h2{flex:1}
header button{padding:.4rem .8rem;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.item{background:var(--surface);border-radius:8px;padding:1rem;margin-bottom:.8rem;display:flex;align-items:center;gap:1rem}
.item .info{flex:1}.item .name{font-weight:600}.item .parsed{font-size:.85rem;color:var(--muted)}
.item .status{font-size:.75rem;padding:.2rem .5rem;border-radius:4px;text-transform:uppercase}
.status.pending{background:#854d0e;color:#fbbf24}.status.confirmed{background:#166534;color:#86efac}.status.rejected{background:#991b1b;color:#fca5a5}
.item button{padding:.4rem .8rem;border-radius:6px;border:none;cursor:pointer;font-size:.85rem;color:#fff}
.btn-confirm{background:var(--success)}.btn-reject{background:var(--danger)}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.dropzone{border:2px dashed var(--border);border-radius:8px;padding:2rem;text-align:center;color:var(--muted);margin-bottom:1.5rem;transition:border-color .15s,color .15s}
.dropzone.active{border-color:var(--accent);color:var(--text)}
.dropzone input{display:none}
.dropzone label{color:var(--accent);cursor:pointer;text-decoration:underline}
.section-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1.5rem 0 .5rem}
#upload-status{margin-top:1rem;text-align:left}
.upload-row{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:6px;font-size:.85rem;margin-bottom:.3rem;background:#0f172a}
.upload-row .icon{flex-shrink:0}
.upload-row .name{font-weight:600;color:var(--text)}
.upload-row .detail{color:var(--muted)}
.upload-row.ok{border-left:3px solid var(--success)}
.upload-row.warn{border-left:3px solid #eab308}
.upload-row.err{border-left:3px solid var(--danger)}
.upload-summary{font-size:.8rem;color:var(--muted);margin-top:.5rem}
.search-row{display:flex;gap:.5rem;margin-bottom:1rem}
.search-row input{flex:1;padding:.6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.search-row button{padding:.6rem 1rem;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.wanted-result{background:var(--surface);border-radius:8px;padding:.8rem 1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:1rem}
.wanted-result .info{flex:1}.wanted-result .title{font-weight:600}.wanted-result .meta{font-size:.8rem;color:var(--muted)}
.wanted-result button{padding:.4rem .9rem;border-radius:6px;border:none;background:var(--success);color:#fff;cursor:pointer;font-size:.85rem}
.wanted-result button:disabled{background:var(--muted);cursor:default}
</style></head><body>
<header><a href="index.html">← Library</a><h2>📥 Incoming Files</h2><button onclick="scan()">🔄 Scan Now</button><div id="bc-nav"></div></header>
<script src="nav.js"></script>
<div class="container">
  <div class="section-label">Upload — added to your library immediately</div>
  <div class="dropzone" id="dropzone">
    Drop ebook/audiobook files here, or <label for="file-input">browse</label>
    <input type="file" id="file-input" multiple accept=".epub,.pdf,.mobi,.azw3,.mp3,.m4b,.flac,.ogg,.zip" onchange="uploadFiles(this.files)">
    <div id="upload-status"></div>
  </div>
  <div class="section-label">Get a book — searches Readarr, downloads land here once found</div>
  <div class="search-row">
    <input type="text" id="wanted-query" placeholder="Book title or author…" onkeydown="if(event.key==='Enter')searchWanted()">
    <button onclick="searchWanted()">Search</button>
  </div>
  <div id="wanted-results"></div>

  <div class="section-label">Server incoming folder — awaiting review (separate from the upload above)</div>
  <div id="list"></div>
</div>
<script src="api.js"></script>
<script>
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let wantedResults = [];
async function searchWanted() {
    const q = document.getElementById('wanted-query').value.trim();
    const box = document.getElementById('wanted-results');
    if (!q) return;
    box.innerHTML = '<p style="color:var(--muted)">Searching…</p>';
    const r = await BC.post('/readarr/search', { query: q });
    if (r.error) { box.innerHTML = `<p style="color:var(--danger)">${esc(r.error)}</p>`; return; }
    wantedResults = r.results || [];
    if (!wantedResults.length) { box.innerHTML = '<p style="color:var(--muted)">No results.</p>'; return; }
    box.innerHTML = wantedResults.map((res, i) => `
      <div class="wanted-result" id="wanted-${i}">
        <div class="info">
          <div class="title">${esc(res.title)}${res.year ? ' (' + esc(res.year) + ')' : ''}</div>
          <div class="meta">${esc(res.author || 'Unknown author')}</div>
        </div>
        <button onclick="addWanted(${i})">⬇ Add &amp; download</button>
      </div>`).join('');
}

async function addWanted(i) {
    const el = document.getElementById('wanted-' + i);
    const btn = el.querySelector('button');
    btn.disabled = true; btn.textContent = 'Adding…';
    const r = await BC.post('/readarr/add', { book: wantedResults[i].book });
    if (r.error) { btn.disabled = false; btn.textContent = '⬇ Add & download'; alert('Failed: ' + r.error); return; }
    btn.textContent = '✓ Added — searching Readarr';
}

// Turn one /books/upload response into a flat list of {filename, status, detail} rows.
// A .zip upload comes back as {zip:true, results:[...]} — one row per file inside it.
function rowsFromResult(filename, r) {
    if (r && r.zip && Array.isArray(r.results)) {
        return r.results.map(inner => rowsFromResult(inner.filename, inner)[0]);
    }
    if (r && (r.error || r.detail)) return [{filename, status: 'err', detail: r.error || r.detail}];
    if (r && r.warning === 'duplicate') return [{filename, status: 'warn', detail: `already have "${r.existing_title}"`}];
    if (r && r.warning === 'likely_duplicate') return [{filename, status: 'warn', detail: `looks like a duplicate (${Math.round((r.similarity||0)*100)}% similar)`}];
    return [{filename, status: 'ok', detail: r?.title || 'added'}];
}

async function uploadFiles(files) {
    const status = document.getElementById('upload-status');
    status.innerHTML = '';
    const rows = [];
    for (const f of files) {
        const r = await BC.upload('/books/upload', f);
        rows.push(...rowsFromResult(f.name, r));
        renderUploadRows(rows);
    }
    document.getElementById('file-input').value = '';
}

function renderUploadRows(rows) {
    const icon = {ok: '✅', warn: '⚠️', err: '❌'};
    const status = document.getElementById('upload-status');
    status.innerHTML = rows.map(r => `<div class="upload-row ${r.status}"><span class="icon">${icon[r.status]}</span><span class="name">${esc(r.filename)}</span><span class="detail">${esc(r.detail)}</span></div>`).join('')
        + `<div class="upload-summary">${rows.filter(r=>r.status==='ok').length} added, ${rows.filter(r=>r.status==='warn').length} skipped, ${rows.filter(r=>r.status==='err').length} failed</div>`;
}
const dz = document.getElementById('dropzone');
let dragDepth = 0;
dz.addEventListener('dragenter', e => { if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault(); dragDepth++; dz.classList.add('active'); });
dz.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
dz.addEventListener('dragleave', e => { e.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dz.classList.remove('active'); });
dz.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    dz.classList.remove('active');
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

async function load() {
    const items = await BC.get('/incoming');
    const el = document.getElementById('list');
    if (!items.length) { el.innerHTML = '<div class="empty">No incoming files. Drop files into the incoming folder.</div>'; return; }
    el.innerHTML = items.map(i => `<div class="item">
        <div class="info"><div class="name">${i.file_name}</div><div class="parsed">Title: ${i.parsed_title||'?'} · Author: ${i.parsed_author||'?'}</div></div>
        <span class="status ${i.status}">${i.status}</span>
        ${i.status === 'pending' ? `<button class="btn-confirm" onclick="confirm('${i.id}')">✓ Confirm</button><button class="btn-reject" onclick="reject('${i.id}')">✕ Reject</button>` : ''}
    </div>`).join('');
}
async function scan() { await BC.post('/incoming/scan'); load(); }
async function confirm(id) { await BC.post('/incoming/' + id + '/confirm'); load(); }
async function reject(id) { await BC.post('/incoming/' + id + '/reject'); load(); }
load();
</script></body></html>
