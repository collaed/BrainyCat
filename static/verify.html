<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainyCat — Verification</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #ffd700; margin-bottom: 8px; }
h2 { color: #87ceeb; margin: 24px 0 12px; border-bottom: 1px solid #333; padding-bottom: 4px; }
.subtitle { color: #888; margin-bottom: 20px; }
.tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.tab { padding: 8px 16px; background: #2a2a4e; border: 1px solid #444; border-radius: 6px 6px 0 0; cursor: pointer; }
.tab.active { background: #3a3a6e; border-bottom-color: #3a3a6e; color: #ffd700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: #2a2a4e; border-radius: 8px; padding: 16px; border: 1px solid #444; }
.card:hover { border-color: #ffd700; }
.card-header { display: flex; gap: 12px; margin-bottom: 12px; }
.cover { width: 60px; height: 80px; object-fit: cover; border-radius: 4px; background: #444; }
.title { font-weight: 600; font-size: 14px; }
.isbn { color: #87ceeb; font-size: 12px; font-family: monospace; }
.confidence { font-size: 24px; font-weight: 700; text-align: center; }
.confidence.high { color: #4caf50; }
.confidence.medium { color: #ff9800; }
.confidence.low { color: #f44336; }
.signals { margin-top: 8px; font-size: 12px; }
.signal { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #333; }
.signal .pts { color: #4caf50; font-weight: 600; }
.signal .pts.zero { color: #666; }
.conflict { background: #4a2020; border: 1px solid #f44336; border-radius: 4px; padding: 8px; margin-top: 8px; font-size: 12px; }
.conflict .label { color: #f44336; font-weight: 600; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-confirm { background: #4caf50; color: white; }
.btn-open { background: #2196f3; color: white; }
.btn-skip { background: #666; color: white; }
.stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: #2a2a4e; padding: 12px 16px; border-radius: 8px; text-align: center; }
.stat .num { font-size: 24px; font-weight: 700; color: #ffd700; }
.stat .label { font-size: 11px; color: #888; }
#loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
<h1>📚 Verification</h1>
<p class="subtitle">Review high-confidence identifications and resolve conflicts</p>

<div class="stats" id="stats"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab('top')">✓ Ready to Confirm</div>
  <div class="tab" onclick="showTab('conflicts')">⚠ Conflicts</div>
</div>

<div id="loading">Loading...</div>
<div class="grid" id="grid"></div>

<script>
const API = '/api/v1/verify';
let currentTab = 'top';

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}

async function loadStats() {
  const s = await api('/stats');
  const el = document.getElementById('stats');
  const dist = s.distribution || {};
  el.innerHTML = `
    <div class="stat"><div class="num">${s.human_verified}</div><div class="label">Verified (100%)</div></div>
    <div class="stat"><div class="num">${dist['90-99'] || 0}</div><div class="label">90-99%</div></div>
    <div class="stat"><div class="num">${dist['70-89'] || 0}</div><div class="label">70-89%</div></div>
    <div class="stat"><div class="num">${dist['50-69'] || 0}</div><div class="label">50-69%</div></div>
    <div class="stat"><div class="num">${dist['30-49'] || 0}</div><div class="label">30-49%</div></div>
    <div class="stat"><div class="num">${dist['0-29'] || 0}</div><div class="label">0-29%</div></div>
  `;
}

async function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'top') || (i === 1 && tab === 'conflicts')));
  document.getElementById('loading').style.display = 'block';
  document.getElementById('grid').innerHTML = '';
  const data = await api(`/${tab}`);
  document.getElementById('loading').style.display = 'none';
  renderGrid(data);
}

function renderGrid(books) {
  const grid = document.getElementById('grid');
  grid.innerHTML = books.map(b => `
    <div class="card" id="card-${b.id}">
      <div class="card-header">
        <img class="cover" src="/api/v1/books/${b.id}/cover" onerror="this.style.display='none'">
        <div>
          <div class="title">${esc(b.title)}</div>
          <div class="isbn">${b.isbn || 'No ISBN'}</div>
          <div class="confidence ${b.confidence >= 80 ? 'high' : b.confidence >= 50 ? 'medium' : 'low'}">${b.confidence}%</div>
        </div>
      </div>
      <div class="signals">
        ${(b.signals || []).map(s => `<div class="signal"><span>${s.name}</span><span class="pts ${s.points === 0 ? 'zero' : ''}">${s.points > 0 ? '+' + s.points : '—'}</span></div>`).join('')}
      </div>
      ${(b.conflicts || []).map(c => `<div class="conflict"><span class="label">⚠ ${c.signal}:</span> ${c.note || c.detected + ' vs ' + c.enrichment}</div>`).join('')}
      <div class="actions">
        <button class="btn btn-confirm" onclick="confirm('${b.id}')">✓ Confirm</button>
        <button class="btn btn-open" onclick="window.open('/static/reader.html?id=${b.id}')">📖 Open</button>
        <button class="btn btn-skip" onclick="skip('${b.id}')">Skip</button>
      </div>
    </div>
  `).join('');
}

async function confirm(id) {
  await api(`/${id}/confirm`, { method: 'POST' });
  document.getElementById('card-' + id).remove();
  loadStats();
}

function skip(id) {
  document.getElementById('card-' + id).remove();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

loadStats();
showTab('top');
</script>
</body>
</html>
